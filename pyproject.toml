[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigManager"
version = "2.0.0"
description = "Python 3 cryptocurrency mining rig manager with profitability selection and dry-run reporting."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "psutil>=5.9.0",
  "selenium>=4.0.0"
]

[project.scripts]
rig-manager = "rig_manager.cli:main"

[tool.ruff]
line-length = 120
src = ["rig_manager", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
